name: CI
on:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck
          Invoke-ScriptAnalyzer -Path ./src -Recurse -EnableExit
      - name: Test (Pester)
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck
          Invoke-Pester -Path ./tests -CI

  package:
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package script artifact
        shell: pwsh
        run: Compress-Archive -Path ./src/* -DestinationPath ComplianceScripts.zip
      - uses: actions/upload-artifact@v4
        with:
          name: compliance-scripts
          path: ComplianceScripts.zip
